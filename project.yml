name: Folio
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.13"
    CURRENT_PROJECT_VERSION: "16"
targets:
  Folio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # Files that come with the app (a private build puts course files here). Optional.
      - path: BundledFiles
        type: folder
        optional: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Folio shows up in "Open in…" and the share sheet for these files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Word and PowerPoint
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.powerpoint.ppt
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        UIRequiresFullScreen: false
        NSCameraUsageDescription: "Folio uses the camera to scan documents and add photos to your pages."
        NSPhotoLibraryAddUsageDescription: "Folio saves pages you export to your photo library."
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.folio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
