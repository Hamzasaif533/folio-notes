name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPad (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Folio.xcodeproj \
            -scheme Folio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | head -n 80
          test -d build/Build/Products/Release-iphoneos/Folio.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Folio.app Payload/
          zip -qry Folio.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: Folio-ipa
          path: Folio.ipa
          retention-days: 30

      - name: Build for simulator
        continue-on-error: true
        run: |
          xcodebuild \
            -project Folio.xcodeproj \
            -scheme Folio \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGN_IDENTITY="-" \
            build > xcodebuild-sim.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild-sim.log | head -n 40

      - name: Take simulator screenshots
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/screenshots.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
          retention-days: 14
